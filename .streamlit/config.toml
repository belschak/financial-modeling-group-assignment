# Theme = shared design tokens (prospectus + notebook figures): calm navy, ochre accent, Inter + Source Serif 4.
[theme]
primaryColor = "#1F4E79"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&display=swap, serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.35rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#14213D"
borderColor = "#E0E5EC"
linkColor = "#1F4E79"

[theme.light.sidebar]
backgroundColor = "#F3F6FA"

[theme.dark]
primaryColor = "#8FB4DE"
backgroundColor = "#0F1622"
secondaryBackgroundColor = "#172131"
textColor = "#E6E9EF"
borderColor = "#2A3547"
linkColor = "#8FB4DE"

[theme.dark.sidebar]
backgroundColor = "#131C2A"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
